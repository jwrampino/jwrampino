<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rolling 7 day average of daily commit count">
  <title>stress chart</title>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3de"/>
      <stop offset="100%" stop-color="#5dcaa5"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', monospace; font-size: 11px; fill: #7fdca4; }
    .axis-title { font-size: 12px; }
  </style>
  <rect x="0" y="0" width="700" height="260" fill="#12211a"/>
  <line x1="55" y1="220.0" x2="680" y2="220.0" stroke="#1a2e23" stroke-width="1"/><line x1="55" y1="170.0" x2="680" y2="170.0" stroke="#1a2e23" stroke-width="1"/><line x1="55" y1="120.0" x2="680" y2="120.0" stroke="#1a2e23" stroke-width="1"/><line x1="55" y1="70.0" x2="680" y2="70.0" stroke="#1a2e23" stroke-width="1"/><line x1="55" y1="20.0" x2="680" y2="20.0" stroke="#1a2e23" stroke-width="1"/>
  <line x1="55" y1="20" x2="55" y2="220" stroke="#2c4536" stroke-width="1"/>
  <line x1="55" y1="220" x2="680" y2="220" stroke="#2c4536" stroke-width="1"/>
  <text x="45" y="220.0" text-anchor="end" dominant-baseline="middle" class="tick">0</text><text x="45" y="170.0" text-anchor="end" dominant-baseline="middle" class="tick">2</text><text x="45" y="120.0" text-anchor="end" dominant-baseline="middle" class="tick">4</text><text x="45" y="70.0" text-anchor="end" dominant-baseline="middle" class="tick">6</text><text x="45" y="20.0" text-anchor="end" dominant-baseline="middle" class="tick">8</text>
  <text x="55.0" y="238" text-anchor="middle" class="tick">Oct 29</text><text x="199.2" y="238" text-anchor="middle" class="tick">Nov 1</text><text x="295.4" y="238" text-anchor="middle" class="tick">Nov 3</text><text x="439.6" y="238" text-anchor="middle" class="tick">Nov 6</text><text x="535.8" y="238" text-anchor="middle" class="tick">Nov 8</text><text x="680.0" y="238" text-anchor="middle" class="tick">Nov 11</text>
  <text x="18" y="120.0" text-anchor="middle" transform="rotate(-90 18 120.0)" class="axis-title">stress (# of commits)</text>
  <polyline points="55.0,220.0 103.1,220.0 151.2,220.0 199.2,220.0 247.3,220.0 295.4,20.0 343.5,120.0 391.5,220.0 439.6,95.0 487.7,220.0 535.8,95.0 583.8,195.0 631.9,45.0 680.0,45.0" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>